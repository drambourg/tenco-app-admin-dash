name: Deploy Cloud Function Tenco App Dashboard - Staging 
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Branch, tag or commit to deploy'
        default: dev
        required: true

env:
  PROJECT_ID: "${{ secrets.GCLOUD_PROJECT_ID_STAGING }}"
  REGION: ${{ vars.GCLOUD_REGION || 'europe-west1'}}
  SERVICE: admin-app-tenco
  GCLOUD_SERVICE_KEY: ${{secrets.GCLOUD_SERVICE_KEY_STAGING}}
  GCP_LOGGER_NAME: ${{ vars.GCP_LOGGER_NAME_STAGING || 'admin-app-tenco-staging' }}
  SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT_STAGING }}

  MEMORY: ${{ vars.MEMORY_STAGING || '512Mi' }}
  CPU: ${{ vars.CPU_STAGING || '1' }}
  MAX_INSTANCES: ${{ vars.MAX_INSTANCES_STAGING || '1' }}
  MIN_INSTANCES: ${{ vars.MIN_INSTANCES_STAGING || '1' }}
  PORT: ${{ vars.PORT_STAGING || '8080' }}
  CONCURRENCY: ${{ vars.CONCURRENCY_STAGING || '100' }}
  TIMEOUT: ${{ vars.TIMEOUT_STAGING || '300' }}

  SERVICE_SENSOR_DATA_DISPATCHER_URL: ${{vars.SERVICE_SENSOR_DATA_DISPATCHER_URL_STAGING}}
 

  REDIS_HOST: ${{ vars.REDIS_HOST_STAGING }}
  REDIS_PORT: ${{ vars.REDIS_PORT_STAGING || '6379' }}

  #  EMQX_BROKER: sample.gcp.emqxcloud.com
  EMQX_BROKER: ${{ vars.EMQX_BROKER_STAGING }}
  EMQX_PORT: 1883
  EMQX_USERNAME: ${{ vars.EMQX_USERNAME_STAGING }}
  EMQX_PASSWORD: ${{ secrets.EMQX_PASSWORD_STAGING }}
  EMQX_CLIENT_ID: ${{ secrets.EMQX_CLIENT_ID_STAGING }}
  EMQX_QOS: 1

jobs:
  deploy-cloud-run:
    name: Deploy Cloud Run
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      service_url: ${{ steps.deploy.outputs.SERVICE_URL }} 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🕵️
        uses: actions/checkout@v4
      
      - name: Use Node.js 🦄
        uses: actions/setup-node@v4
        with:
          node-version: '20.14.0'
      
      - name: Install Dependencies 🔧
        run: |
          npm install --immutable

      - name: Build Project 🏗️
        run: |
          npm run build

      - name: Verify Required Variables ✅
        run: |
          required_vars=("PROJECT_ID" "SERVICE_ACCOUNT" "GCLOUD_SERVICE_KEY" "REDIS_HOST" "EMQX_BROKER" "EMQX_USERNAME" "EMQX_PASSWORD" "EMQX_CLIENT_ID")
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "Error: $var is not set."
              exit 1
            fi
          done

      - name: Google Auth 🔒
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ env.GCLOUD_SERVICE_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      
      - name: Set up Docker Buildx 🐳
        uses: docker/setup-buildx-action@v3

      - name: Create temporary Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM node:20-slim
          WORKDIR /app
          COPY dist/ ./dist/
          COPY package*.json ./
          RUN npm ci --only=production
          EXPOSE ${{ env.PORT }}
          CMD ["node", "dist/index.js"]
          EOF

      - name: Configure Docker for EU GCR
        run: |
          gcloud auth configure-docker eu.gcr.io --quiet

      - name: Build and push Docker image 🏗️
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: eu.gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}

      - name: Deploy to Cloud Run 🚀
        id: deploy
        run: |
          ENV_VARS="NODE_ENV=stage,DEBUG=$DEBUG,GCP_LOGGER_NAME=$GCP_LOGGER_NAME,GCP_PROJECT_ID=$PROJECT_ID,REDIS_HOST=$REDIS_HOST,REDIS_PORT=$REDIS_PORT,SERVICE_SENSOR_DATA_DISPATCHER_URL=$SERVICE_SENSOR_DATA_DISPATCHER_URL,EMQX_BROKER=$EMQX_BROKER,EMQX_PORT=$EMQX_PORT,EMQX_USERNAME=$EMQX_USERNAME,EMQX_PASSWORD=$EMQX_PASSWORD,EMQX_CLIENT_ID=$EMQX_CLIENT_ID,EMQX_QOS=$EMQX_QOS"
          
          # Déploiement sur Cloud Run avec gcloud directement
          gcloud run deploy $SERVICE \
            --project=$PROJECT_ID \
            --region=$REGION \
            --image=eu.gcr.io/$PROJECT_ID/$SERVICE:${{ github.sha }} \
            --port=$PORT \
            --memory=$MEMORY \
            --cpu=$CPU \
            --max-instances=$MAX_INSTANCES \
            --min-instances=$MIN_INSTANCES \
            --concurrency=$CONCURRENCY \
            --timeout=${TIMEOUT}s \
            --service-account=$SERVICE_ACCOUNT \
            --set-env-vars=$ENV_VARS \
            --platform=managed \
            --allow-unauthenticated
            
          # Obtenir l'URL du service déployé
          SERVICE_URL=$(gcloud run services describe $SERVICE --region=$REGION --format="value(status.url)")
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV

      - name: Show Cloud Run Output 👀
        run: echo ${{ steps.deploy.outputs.url }}